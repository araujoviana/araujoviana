<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 244" width="840" height="244" role="img" aria-label="Animated ASCII spaceships flying through a starfield">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#101a30"/></linearGradient>
  <clipPath id="frame"><rect width="840" height="244" rx="14"/></clipPath>
</defs>
<style>
  text { font-family: ui-monospace, 'DejaVu Sans Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 14px; white-space: pre; }
  .ship { paint-order: stroke; stroke: #0a1020; stroke-width: 5px; stroke-linejoin: round; }
  .tw { animation-name: twinkle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  @keyframes twinkle { 0%,100% { opacity: var(--lo); } 50% { opacity: var(--hi); } }
  .drift-far  { animation: driftL 90s linear infinite; }
  .drift-near { animation: driftL 45s linear infinite; }
  @keyframes driftL { from { transform: translateX(0); } to { transform: translateX(-840px); } }
  .fly-r { animation-name: flyR; animation-iteration-count: infinite; animation-timing-function: linear; }
  .fly-l { animation-name: flyL; animation-iteration-count: infinite; animation-timing-function: linear; }
  @keyframes flyR { from { transform: translateX(-300px); } to { transform: translateX(880px); } }
  @keyframes flyL { from { transform: translateX(880px); } to { transform: translateX(-300px); } }
  .flick { animation: flick .35s steps(1) infinite; }
  @keyframes flick { 0% { opacity: 1; } 50% { opacity: .3; } 100% { opacity: 1; } }
  .blink { animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
